<main class="mw1400">
    <section>
        <header>
            <div class="header-content">
                <p class="badge">Draft</p>
                <h1>Create new survey</h1>
            </div>
            <button routerLink="/" class="cancel-btn">Cancel <img src="/assets/imgs/close.png" alt=""></button>
        </header>

        <div class="form">
            <div class="top-form">
                <div class="left-top-form">
                    <div>
                        <h2>Survey name</h2>
                        <div>
                            <input type="text" placeholder="Enter survey name">
                            <button>
                                <img src="/assets/imgs/Bin.png" alt="">
                            </button>
                        </div>
                    </div>
                    <div>
                        <div>
                            <h2>Set end date (optional)</h2>
                            <div>
                                <input type="date">
                                <button>
                                    <img src="/assets/imgs/Bin.png" alt="">
                                </button>
                            </div>
                        </div>
                    </div>                  
                </div>
                <div class="right-top-form">
                    <h2>Describing text (optional)</h2>
                    <div>
                        <textarea ></textarea>
                        <button>
                            <img src="/assets/imgs/Bin.png" alt="">
                        </button>
                    </div>
                </div>
            </div>      
            
            <div class="bottom-form">
                @for (question of questionForms; track question.id) {
                    <app-question-form></app-question-form>
                }
                <button (click)="addQuestionForm()">
                    Add  next question <img src="" alt="">
                </button>
            </div>
        </div>
    </section>
    <button>
        Publish
        <img>
    </button>
</main>
