<main>
    <section>
        <header>
            <div>
                <p>Draft</p>
                <h1>Create new survey</h1>
            </div>
            <button routerLink="/">Cancel X</button>
        </header>

        <div class="form">
            <div class="top-form">
                <div class="left-top-form">
                    <div>
                        <h2>Survey name</h2>
                        <div>
                            <input type="text" placeholder="Enter survey name">
                            <img src="" alt="">
                        </div>
                    </div>
                    <div>
                        <div>
                            <h2>Set end date (optional)</h2>
                            <div>
                                <input type="date">
                                <img src="" alt="">
                            </div>
                        </div>
                    </div>                  
                </div>
                <div class="right-top-form">
                    <h2>Describing text (optional)</h2>
                    <div>
                        <textarea ></textarea>
                        <button><img src="" alt=""></button>
                    </div>
                </div>
            </div>      
            
            <div class="bottom-form">
                @for (question of questionForms; track question.id) {
                    <app-question-form></app-question-form>
                }
                <button (click)="addQuestionForm()">
                    Add  next question <img src="" alt="">
                </button>
            </div>
        </div>
    </section>
    <button>
        Publish
        <img>
    </button>
</main>
