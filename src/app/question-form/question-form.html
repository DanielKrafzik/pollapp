<div class="question-form">
    <div class="question-title">
        <h2>1. Question</h2>
        <button><img src="assets/imgs/Bin.png" alt=""></button>
    </div>
    <input type="text" class="question-input">
    <div class="answers-header">
        <h2>Answers</h2>
        <div class="answers-checkbox">
            <input type="checkbox">
            <p>Allow multiple answers</p>
        </div>
    </div>
    <div>
        @for (answer of answers; track $index) {
            <div class="answer">
                <h2>{{ answer.letter }}.</h2>

                <input
                    type="text">

                <button (click)="removeAnswer($index)">
                    <img src="assets/imgs/Bin.png" alt="">
                </button>
            </div>
        }
        <button class="add-answer" (click)="addAnswer()" [disabled]="answers.length === 6">Add answer <img src="assets/imgs/add_circle_white.png" alt=""></button>
    </div>
</div>
