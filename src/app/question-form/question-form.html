<div class="question-form">
    <div class="question-title">
        <h2>{{ index + 1 }}. Question</h2>
        <button class="delete-btn" (click)="onDelete()">
            <img src="assets/imgs/Bin.png" class="bin-default" alt="">
            <img src="assets/imgs/Bin_hover.png" class="bin-hover" alt="">
        </button>
    </div>
    <input type="text" class="question-input" [(ngModel)]="question.question" minLength="3" maxlength="40" >
    <div class="answers-header">
        <h2 class="answers-title">Answers</h2>
        <div class="answers-checkbox">
            <input type="checkbox" class="checkbox" [(ngModel)]="question.multiple_answers">
            <p>Allow multiple answers</p>
        </div>
    </div>
    <div class="answer-div">
        @for (answer of question.answers; track $index) {
            <div class="answer">
                <h2>{{ answer.letter }}.</h2>
                <input
                    type="text" [(ngModel)]="answer.text" minLength="1" maxlength="30">
                <button (click)="removeAnswer($index)" class="delete-btn">
                    <img src="assets/imgs/Bin.png" class="bin-default" alt=""><img src="assets/imgs/Bin_hover.png" class="bin-hover" alt="">
                </button>
            </div>
        }
        <button class="add-answer" (click)="addAnswer()" [disabled]="question.answers.length === 6">Add answer <img src="assets/imgs/add_circle_white.png" alt=""></button>
    </div>
</div>
