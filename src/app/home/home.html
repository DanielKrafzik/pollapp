<main >
    <div class="mw1400 margin-l">
        <img src="/assets/imgs/Logo.png" alt="Home" class="logo">

        <section class="up-section">
            <div class="new-survey-div">
                <div>
                    <h1>Collect Feedback,<br> Unlock Ideas</h1>
                    <p>Create and surveys in minutes - from team events to workplace culture. Collect opinions, engage your audience, and turn feedback into action.</p>
                    <button>New survey <img src="/assets/imgs/add_circle.png" alt="" class="add-circle"></button>
                </div>
                <img src="/assets/imgs/example.png" alt="">
            </div>
            <div class="ending-soon-surveys">
                <h2>Your surveys</h2>
                <h3>Ending soon surveys</h3>
                <div class="survey-row">
                    <div *ngFor="let survey of supabase.surveys()" class="survey-card">
                        <div class="survey-card-header">
                            <p>{{ survey.category }}</p>
                            <h4>{{ survey.name }}</h4>
                        </div>
                        <p class="p-highlight">{{ getEndsInText(survey.enddate) }}</p>
                    </div>
                </div>
            </div>
        </section>

        <section>
            <div>
                <button>Active survey</button>
                <button>Past survey</button>
                <input placeholder="Sort by categories">
            </div>
            <div>
                <div></div>
            </div>
        </section>

    </div>
</main>
